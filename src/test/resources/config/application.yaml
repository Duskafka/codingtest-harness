# 테스트에서만 쓰는 설정. classpath:/config/application.yaml은 main의 classpath:/application.yaml 위에 덮인다
# (Spring Boot 기본 설정 위치). 그래서 모든 테스트 컨텍스트가 따로 설정하지 않아도 뜬다.
#
# GitHub App의 client ID·secret은 운영에서 환경 변수로 받는다 (main application.yaml).
# 아래는 실제 App과 관계없는 가짜 값이다. 테스트는 GitHub에 접속하지 않는다 (S04 '주의할 것', external-systems).
spring:
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test-client-id
            client-secret: test-client-secret

# GitHub 웹훅 시크릿 (S06). 운영에서는 환경 변수로만 받는다 (main application.yaml, infra.md 9.6).
# 아래는 테스트 안에서만 쓰는 가짜 값이다. 테스트는 이 값으로 payload에 서명한다 (github.WebhookTestSupport).
# 교체 중 상태(옛 시크릿도 받음)를 모든 웹훅 테스트의 기본으로 둔다. 옛 시크릿이 없을 때는 GithubSignatureVerifierTest가 본다.
studybot:
  github:
    webhook:
      secret: test-webhook-secret
      previous-secret: test-webhook-secret-previous
    # GitHub App (S07). 운영에서는 환경 변수로 받는다 (main application.yaml). 아래는 실제 App과 관계없는 가짜 값이다.
    # private key와 API 주소는 테스트가 뜰 때 정한다 (GithubAppTestConfiguration: 테스트 안에서 만든 키, WireMock).
    app:
      client-id: test-github-app-client-id
      slug: studybot-test-app
