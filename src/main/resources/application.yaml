spring:
  application:
    name: studybot
  # 앱 테이블은 모두 studybot 스키마에 둔다 (결정 제안서 004). search_path에 맡기지 않고 Flyway·Hibernate·Spring Session에
  # 스키마를 직접 적는다. Supabase Session pooler가 연결의 search_path를 넘겨주는지 확인하지 못했기 때문이다 (S04 PR 판단 기록).
  flyway:
    # schemas의 첫 스키마가 기본 스키마가 되고, 없으면 Flyway가 만든다 (create-schemas 기본 true). 이력 테이블도 여기에 생긴다.
    schemas: studybot
    default-schema: studybot
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: studybot
  session:
    # 30일 롤링 (결정 제안서 002 ② a). 요청마다 마지막 접근 시각이 갱신되고, 30일 동안 요청이 없으면 만료된다.
    # 쿠키 Max-Age도 이 값을 쓰고, 브라우저 쪽 쿠키도 같이 굴러가게 auth.session.RollingSessionCookieFilter가 쿠키를 다시 쓴다.
    timeout: 30d
    jdbc:
      table-name: studybot.SPRING_SESSION
      # 세션 테이블은 Flyway 마이그레이션(V2)으로 만든다 (data-model.md 마이그레이션 원칙).
      initialize-schema: never
  security:
    oauth2:
      client:
        registration:
          # 로그인은 웹훅용 GitHub App의 사용자 인증으로 한다 (OD-02, 결정 제안서 005). 등록 ID가 github라
          # Spring Security의 CommonOAuth2Provider.GITHUB 기본값(엔드포인트, user-name-attribute=id)을 쓴다.
          # 값은 서버 .env에서 받는다 (infra.md 9.6 'GitHub App client secret'). 기본값을 두지 않아 없으면 기동이 실패한다.
          github:
            client-id: ${GITHUB_APP_CLIENT_ID}
            client-secret: ${GITHUB_APP_CLIENT_SECRET}
  web:
    resources:
      # API 서버는 정적 파일을 주지 않는다. 프론트 정적 파일은 Nginx가 준다 (docs/spec/architecture.md 4.1).
      # 없는 경로는 정적 리소스 탐색 없이 404 problem+json이 된다.
      add-mappings: false

# 세션 쿠키(이름 __Host-Http-SESSION, HttpOnly, Secure, SameSite=Lax, Max-Age 30일)는
# server.servlet.session.cookie.*가 아니라 auth.session.SessionCookieConfiguration에 있다. 이유는 그 클래스 주석.

# Actuator는 health만 켜고 노출한다 (docs/spec/security.md 9.7).
# access.default=none이면 접근할 수 없는 엔드포인트는 컨텍스트에서 아예 빠진다.
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
      # /actuator 링크 목록도 끈다. 외부에 노출하는 운영 엔드포인트는 health뿐이다 (api.md 4.4).
      discovery:
        enabled: false
  endpoint:
    health:
      access: read-only

# API 명세(/v3/api-docs)는 기본으로 끈다. 로컬 개발이나 명세 생성 때만
# springdoc.api-docs.enabled=true로 켠다 (알려진 충돌 8번, S01 PR 판단 기록).
springdoc:
  api-docs:
    enabled: false

# GitHub 웹훅 (S06, processes 5.3). github.webhook.GithubWebhookProperties
studybot:
  github:
    webhook:
      # 시크릿은 서버 .env의 환경 변수로만 받는다 (infra.md 9.6 'GitHub 웹훅 시크릿'). 기본값이 없어 없으면 기동이 실패한다.
      secret: ${GITHUB_WEBHOOK_SECRET}
      # 시크릿을 교체하는 동안만 옛 값을 넣는다. 옛 값과 새 값으로 서명한 요청을 모두 받는다. 교체가 끝나면 비운다.
      previous-secret: ${GITHUB_WEBHOOK_SECRET_PREVIOUS:}
      # 이보다 큰 본문은 413으로 거절한다 (5.3 '주의할 것' "예: 5MB"). Nginx client_max_body_size도 같이 건다 (S17).
      max-body-size: 5MB
    # GitHub App (S07, processes 5.2). github.api.GithubAppProperties
    app:
      # App JWT의 iss. GitHub는 client ID를 권한다. 로그인용 client ID(GITHUB_APP_CLIENT_ID)와 같은 App이라 같은 값이다 (결정 제안서 005).
      client-id: ${GITHUB_APP_CLIENT_ID}
      # 설치 주소 https://github.com/apps/{slug}/installations/new 의 App 이름. 비밀값이 아니다. 없으면 기동이 실패한다.
      slug: ${GITHUB_APP_SLUG}
      # private key는 서버 파일 경로로만 받는다 (infra.md 9.6: 권한 400, 읽기 전용 마운트. 사람이 정함 2026-11-24 "파일만").
      # 키 내용을 환경 변수로 받지 않는다. 없으면 기동이 실패한다. 키 내용은 로그에 찍지 않는다.
      private-key-path: ${GITHUB_APP_PRIVATE_KEY_PATH:}

# 판정 배치 (S12, processes 5.10). judgment.JudgmentSchedule
# 5분마다 돈다. 서버가 여러 대여도 ShedLock으로 한 번만 돈다 (common.scheduling.SchedulingConfiguration).
# 판정 시각이 지난 날만 판정하니(R9) 주기는 판정이 얼마나 늦어질 수 있는지만 정한다. "-"면 끈다(Spring 비활성 cron).
  judgment:
    cron: "0 */5 * * * *"
